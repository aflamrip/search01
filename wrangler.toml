name = "search-engine-platform"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]

# ─────────────────────────────────────────────
# D1 Database
# ─────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "my-app"
database_id = "9e38be37-4638-431b-812a-5a2d389f4247"

# ─────────────────────────────────────────────
# KV Namespace (Cache)
# IMPORTANT: binding must match env.CACHE_KV in code
# ─────────────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE_KV"
id = "a8ae66000e3347ea9999ebb1f9736d21"

# ─────────────────────────────────────────────
# R2 Bucket (Assets / Thumbnails)
# ─────────────────────────────────────────────
[[r2_buckets]]
binding = "STORAGE_R2"
bucket_name = "search-engine-assets"

# ─────────────────────────────────────────────
# Queues (Producers only)
# NOTE: Consumers are removed from this Worker because
# Astro's Cloudflare Adapter only exports fetch(), not queue().
# Queue consumers will be handled by dedicated Workers later.
# ─────────────────────────────────────────────
[[queues.producers]]
queue = "sitemap-queue"
binding = "SITEMAP_QUEUE"

[[queues.producers]]
queue = "crawl-queue"
binding = "CRAWL_QUEUE"

[[queues.producers]]
queue = "index-queue"
binding = "INDEX_QUEUE"


[[queues.consumers]]
queue = "sitemap-queue"
max_batch_size = 10
max_batch_timeout = 5

[[queues.consumers]]
queue = "crawl-queue"
max_batch_size = 5
max_batch_timeout = 10

[[queues.consumers]]
queue = "index-queue"
max_batch_size = 20
max_batch_timeout = 5